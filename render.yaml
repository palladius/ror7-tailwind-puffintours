# Render.com Blueprint for Puffin Tours (Rails 8 + Docker)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: puffin-tours
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "2"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RUBY_GC_HEAP_GROWTH_FACTOR
        value: "1.1"
      - key: RUBY_GC_MALLOC_LIMIT
        value: "16000000"
      - key: RUBY_GC_OLDMALLOC_LIMIT
        value: "16000000"
      - key: RUBY_YJIT_ENABLE
        value: "0"
      - key: BUCKET
        value: puffintours-assets
      - key: PROJECT_ID
        value: ric-cccwiki
      - key: GCP_SA_JSON_BASE64
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: PUFFIN_TOURS_GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Provide either DATABASE_URL (e.g. Supabase / Neon / Render Postgres)
      # OR the 4 DATABASE_* variables below (e.g. existing Cloud SQL pg-prod)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASS
        sync: false
