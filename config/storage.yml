test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# In Cloud Run l'autenticazione avviene via ADC/IAM (iam: true + gsa_email) o con il file JSON se presente.
# In locale se vuoi testare GCS serve `private/puffin-tours-secret-key.json` e ACTIVE_STORAGE_SERVICE=gcs.
gcs: &gcs
  service: GCS
  project: <%= ENV.fetch("PROJECT_ID", "puffin-tours") %>
  bucket: <%= ENV.fetch("BUCKET", "puffin-tours-public") %>
<% if File.exist?(Rails.root.join("private/puffin-tours-secret-key.json")) %>
  credentials: <%= Rails.root.join("private/puffin-tours-secret-key.json") %>
<% else %>
  iam: true
  gsa_email: <%= ENV.fetch("SA_EMAIL", "puffintours-app-storager@puffin-tours.iam.gserviceaccount.com") %>
<% end %>
  public: true

development:
  <<: *gcs

production:
  <<: *gcs

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>
